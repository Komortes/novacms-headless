name: Build & Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  ECR_REPOSITORY: novacms-app
  EKS_CLUSTER_NAME: novacms

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip deploy when AWS is not configured
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          echo "AWS_ROLE_ARN secret is not configured. Skipping ECR/EKS deploy."

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: ${{ env.AWS_ROLE_ARN != '' }}
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f docker/php/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update kubeconfig
        if: ${{ env.AWS_ROLE_ARN != '' }}
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy via Helm
        if: ${{ env.AWS_ROLE_ARN != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm dependency update charts/novacms
          helm upgrade --install novacms charts/novacms \
            -f charts/novacms/values-eks.yaml \
            --set app.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set app.image.tag=$IMAGE_TAG \
            --set horizon.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set horizon.image.tag=$IMAGE_TAG \
            --set reverb.image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set reverb.image.tag=$IMAGE_TAG \
            --atomic \
            --timeout 5m
