apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "novacms.fullname" . }}-ollama
  labels:
    {{- include "novacms.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ include "novacms.fullname" . }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "novacms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "novacms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "novacms.fullname" . }}-ollama-models
