apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "novacms.fullname" . }}-reverb
  labels:
    {{- include "novacms.labels" . | nindent 4 }}
    app.kubernetes.io/component: reverb
  annotations:
    # ingress-nginx handles WebSocket upgrades natively; snippet annotations
    # are disabled by default in modern releases and would break deploys.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.reverb }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novacms.fullname" . }}-reverb
                port:
                  number: 8080
