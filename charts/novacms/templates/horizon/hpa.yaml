apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "novacms.fullname" . }}-horizon
  labels:
    {{- include "novacms.labels" . | nindent 4 }}
    app.kubernetes.io/component: horizon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "novacms.fullname" . }}-horizon
  minReplicas: {{ .Values.horizon.hpa.minReplicas }}
  maxReplicas: {{ .Values.horizon.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.horizon.hpa.targetCPUUtilizationPercentage }}
