apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "novacms.fullname" . }}-app
  labels:
    {{- include "novacms.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.app }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "novacms.fullname" . }}-app
                port:
                  number: 8000
