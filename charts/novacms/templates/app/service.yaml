apiVersion: v1
kind: Service
metadata:
  name: {{ include "novacms.fullname" . }}-app
  labels:
    {{- include "novacms.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "novacms.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
