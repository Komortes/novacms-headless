global:
  security:
    allowInsecureImages: true

app:
  image:
    repository: novacms-app
    tag: local
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

horizon:
  image:
    repository: novacms-app
    tag: local
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

reverb:
  image:
    repository: novacms-app
    tag: local
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

ollama:
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  port: 11434
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 8Gi

ingress:
  className: nginx
  hosts:
    app: novacms.local
    reverb: ws.novacms.local
    grafana: grafana.novacms.local

postgresql:
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16
  auth:
    database: novacms
    username: novacms
    existingSecret: novacms-secrets
    secretKeys:
      userPasswordKey: DB_PASSWORD
  primary:
    persistence:
      size: 10Gi
      storageClass: ""

redis:
  auth:
    existingSecret: novacms-secrets
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""

kube-prometheus-stack:
  enabled: true
  grafana:
    adminPassword: admin
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.novacms.local
  prometheus:
    prometheusSpec:
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false

sealed-secrets:
  enabled: true
  fullnameOverride: sealed-secrets
