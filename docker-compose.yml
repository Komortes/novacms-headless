services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novacms
      POSTGRES_USER: novacms
      POSTGRES_PASSWORD: novacms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
