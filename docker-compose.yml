x-demo-env: &demo-env
  APP_NAME: NovaCMS
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: novacms
  DB_USERNAME: novacms
  DB_PASSWORD: novacms
  SESSION_DRIVER: file
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: local
  REVERB_APP_KEY: localkey
  REVERB_APP_SECRET: localsecret
  REVERB_HOST: demo-reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  VITE_REVERB_APP_KEY: localkey
  VITE_REVERB_HOST: 127.0.0.1
  VITE_REVERB_PORT: 8080
  VITE_REVERB_SCHEME: http
  AI_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: qwen2.5:1.5b
  OLLAMA_TIMEOUT: 90
  AI_SUMMARY_AUTO_DISPATCH: "false"
  AI_EMBEDDINGS_PROVIDER: ollama
  AI_EMBEDDINGS_MODEL: nomic-embed-text
  AI_EMBEDDINGS_DIMENSIONS: 1024
  AI_EMBEDDINGS_AUTO_DISPATCH: "false"
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_MODEL: gpt-4.1-mini
  LOG_CHANNEL: stack
  LOG_STACK: stderr
  MAIL_MAILER: log
  DOMAIN_EVENTS_STREAM_ENABLED: "false"
  NOVACMS_DEMO_BOOTSTRAP: "false"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novacms
      POSTGRES_USER: novacms
      POSTGRES_PASSWORD: novacms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacms -d novacms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  demo-app:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/demo/Dockerfile
    environment:
      <<: *demo-env
      NOVACMS_DEMO_BOOTSTRAP: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - demo_shared:/demo-shared
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp=@fsockopen(\"127.0.0.1\", 8000); if (! is_resource($$fp)) { exit(1); } fclose($$fp);'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  demo-horizon:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/demo/Dockerfile
    environment: *demo-env
    depends_on:
      demo-app:
        condition: service_healthy
    volumes:
      - demo_shared:/demo-shared
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q '^Horizon is running'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  demo-reverb:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/demo/Dockerfile
    environment:
      <<: *demo-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      demo-app:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - demo_shared:/demo-shared
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp=@fsockopen(\"127.0.0.1\", 8080); if (! is_resource($$fp)) { exit(1); } fclose($$fp);'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  ollama:
  demo_shared:
