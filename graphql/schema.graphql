"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JsonScalar")

enum ContentType {
    POST @enum(value: "post")
    PAGE @enum(value: "page")
}

enum ContentStatus {
    DRAFT @enum(value: "draft")
    PUBLISHED @enum(value: "published")
    ARCHIVED @enum(value: "archived")
}

enum SummaryStatus {
    PENDING @enum(value: "pending")
    GENERATING @enum(value: "generating")
    READY @enum(value: "ready")
    FAILED @enum(value: "failed")
}

type Content {
    id: ID!
    type: ContentType!
    slug: String!
    title: String!
    body: String!
    locale: String!
    status: ContentStatus!
    content_hash: String!
    summary: ContentAiSummary @hasOne
    created_at: DateTime!
    updated_at: DateTime!
}

type ContentAiSummary {
    id: ID!
    content_id: ID!
    summary_tldr: String
    summary_bullets: [String!]
    summary_meta_description: String
    summary_faq: JSON
    summary_tags: [String!]
    status: SummaryStatus!
    model: String
    prompt_version: String
    tokens_in: Int
    tokens_out: Int
    generation_ms: Int
    last_error: String
    content: Content! @belongsTo
    created_at: DateTime!
    updated_at: DateTime!
}

type Prompt {
    id: ID!
    name: String!
    version: String!
    template: String!
    parameters: JSON
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type SemanticContentMatch {
    content: Content!
    score: Float!
}

type Query {
    me: User @auth(guards: ["web", "api-token"])

    user(
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @guard(with: ["web", "api-token"]) @apiAbility(ability: "graphql:admin") @find

    users(
      name: String @where(operator: "like")
    ): [User!]! @guard(with: ["web", "api-token"]) @apiAbility(ability: "graphql:admin") @paginate(defaultCount: 10, maxCount: 25)

    content(
        id: ID! @rules(apply: ["integer", "exists:contents,id"])
        locale: String @rules(apply: ["nullable", "regex:/^[a-z]{2}(?:-[A-Z]{2})?$/"])
        status: ContentStatus
        type: ContentType
    ): Content
        @throttle(name: "graphql-read")
        @field(resolver: "App\\GraphQL\\Queries\\ContentQuery")
    contents(
        locale: String @rules(apply: ["nullable", "regex:/^[a-z]{2}(?:-[A-Z]{2})?$/"])
        status: ContentStatus
        type: ContentType
    ): [Content!]!
        @throttle(name: "graphql-read")
        @paginate(builder: "App\\GraphQL\\Queries\\ContentsBuilder", defaultCount: 20, maxCount: 50)

    contentAiSummary(id: ID! @eq @rules(apply: ["integer", "exists:content_ai_summaries,id"])): ContentAiSummary
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:admin")
        @find(model: "App\\Models\\ContentAiSummary")
    contentAiSummaries: [ContentAiSummary!]!
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:admin")
        @paginate(model: "App\\Models\\ContentAiSummary", defaultCount: 20, maxCount: 50)

    prompt(id: ID! @eq @rules(apply: ["integer", "exists:prompts,id"])): Prompt
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:admin")
        @find(model: "App\\Models\\Prompt")
    prompts: [Prompt!]!
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:admin")
        @paginate(model: "App\\Models\\Prompt", defaultCount: 20, maxCount: 50)
    activePrompt(
        name: String! @rules(apply: ["string", "min:2", "max:120"])
        version: String @rules(apply: ["nullable", "string", "max:40"])
    ): Prompt
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:admin")
        @field(resolver: "App\\GraphQL\\Queries\\ActivePromptQuery")
    semanticSearch(
        query: String! @rules(apply: ["string", "min:3", "max:500"]),
        limit: Int = 10 @rules(apply: ["integer", "min:1", "max:20"]),
        locale: String @rules(apply: ["nullable", "regex:/^[a-z]{2}(?:-[A-Z]{2})?$/"]),
        status: ContentStatus,
        type: ContentType,
        min_score: Float @rules(apply: ["nullable", "numeric", "between:-1,1"])
    ): [SemanticContentMatch!]!
        @throttle(name: "graphql-search")
        @field(resolver: "App\\GraphQL\\Queries\\SemanticSearchQuery")
    relatedContent(
        content_id: ID! @rules(apply: ["integer", "exists:contents,id"]),
        limit: Int = 5 @rules(apply: ["integer", "min:1", "max:20"]),
        locale: String @rules(apply: ["nullable", "regex:/^[a-z]{2}(?:-[A-Z]{2})?$/"]),
        status: ContentStatus,
        type: ContentType,
        min_score: Float @rules(apply: ["nullable", "numeric", "between:-1,1"])
    ): [SemanticContentMatch!]!
        @throttle(name: "graphql-search")
        @field(resolver: "App\\GraphQL\\Queries\\RelatedContentQuery")
}

type Mutation {
    createContent(
        type: ContentType!
        slug: String!
        title: String!
        body: String!
        locale: String = "en"
        status: ContentStatus = DRAFT
    ): Content
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:write")
        @throttle(name: "graphql-write")
        @field(resolver: "App\\GraphQL\\Mutations\\CreateContentMutation")

    updateContent(
        id: ID! @rules(apply: ["integer", "exists:contents,id"])
        type: ContentType
        slug: String
        title: String
        body: String
        locale: String
        status: ContentStatus
    ): Content
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:write")
        @throttle(name: "graphql-write")
        @field(resolver: "App\\GraphQL\\Mutations\\UpdateContentMutation")

    generateContentSummary(
        content_id: ID! @rules(apply: ["integer", "exists:contents,id"])
        prompt_version: String @rules(apply: ["nullable", "string", "max:40"])
    ): ContentAiSummary
        @guard(with: ["web", "api-token"])
        @apiAbility(ability: "graphql:write")
        @throttle(name: "graphql-write")
        @field(resolver: "App\\GraphQL\\Mutations\\GenerateContentSummaryMutation")
}

type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}
