"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JsonScalar")

enum ContentType {
    POST @enum(value: "post")
    PAGE @enum(value: "page")
}

enum ContentStatus {
    DRAFT @enum(value: "draft")
    PUBLISHED @enum(value: "published")
    ARCHIVED @enum(value: "archived")
}

enum SummaryStatus {
    PENDING @enum(value: "pending")
    GENERATING @enum(value: "generating")
    READY @enum(value: "ready")
    FAILED @enum(value: "failed")
}

type Content {
    id: ID!
    type: ContentType!
    slug: String!
    title: String!
    body: String!
    locale: String!
    status: ContentStatus!
    content_hash: String!
    summary: ContentAiSummary @hasOne
    created_at: DateTime!
    updated_at: DateTime!
}

type ContentAiSummary {
    id: ID!
    content_id: ID!
    summary_tldr: String
    summary_bullets: [String!]
    summary_meta_description: String
    summary_faq: JSON
    summary_tags: [String!]
    status: SummaryStatus!
    model: String
    prompt_version: String
    tokens_in: Int
    tokens_out: Int
    generation_ms: Int
    last_error: String
    content: Content! @belongsTo
    created_at: DateTime!
    updated_at: DateTime!
}

type Prompt {
    id: ID!
    name: String!
    version: String!
    template: String!
    parameters: JSON
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type SemanticContentMatch {
    content: Content!
    score: Float!
}

type Query {
    user(
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    users(
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    content(id: ID! @eq): Content @find(model: "App\\Models\\Content")
    contents: [Content!]! @paginate(model: "App\\Models\\Content", defaultCount: 20)

    contentAiSummary(id: ID! @eq): ContentAiSummary @find(model: "App\\Models\\ContentAiSummary")
    contentAiSummaries: [ContentAiSummary!]! @paginate(model: "App\\Models\\ContentAiSummary", defaultCount: 20)

    prompt(id: ID! @eq): Prompt @find(model: "App\\Models\\Prompt")
    prompts: [Prompt!]! @paginate(model: "App\\Models\\Prompt", defaultCount: 20)
    activePrompt(name: String!, version: String): Prompt @field(resolver: "App\\GraphQL\\Queries\\ActivePromptQuery")
    semanticSearch(query: String!, limit: Int = 10, locale: String): [SemanticContentMatch!]!
        @field(resolver: "App\\GraphQL\\Queries\\SemanticSearchQuery")
    relatedContent(content_id: ID!, limit: Int = 5): [SemanticContentMatch!]!
        @field(resolver: "App\\GraphQL\\Queries\\RelatedContentQuery")
}

type Mutation {
    createContent(
        type: ContentType!
        slug: String!
        title: String!
        body: String!
        locale: String = "en"
        status: ContentStatus = DRAFT
    ): Content @create(model: "App\\Models\\Content")

    updateContent(
        id: ID!
        type: ContentType
        slug: String
        title: String
        body: String
        locale: String
        status: ContentStatus
    ): Content @update(model: "App\\Models\\Content")

    generateContentSummary(
        content_id: ID!
        prompt_version: String
    ): ContentAiSummary @field(resolver: "App\\GraphQL\\Mutations\\GenerateContentSummaryMutation")
}

type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}
